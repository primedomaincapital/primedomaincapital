name: Clean rebuild

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Wipe repo and install fresh site files
        run: |
          set -euo pipefail
          echo "== Staged archive =="
          ls -la pdc-elevated.zip
          rm -rf /tmp/fresh && mkdir -p /tmp/fresh
          unzip -o pdc-elevated.zip -d /tmp/fresh
          rm -rf /tmp/fresh/__MACOSX
          find /tmp/fresh -name '.DS_Store' -delete
          SRC=/tmp/fresh
          if [ "$(ls -A "$SRC" | wc -l)" -eq 1 ] && [ -d "$SRC/$(ls -A "$SRC")" ]; then
            SRC="$SRC/$(ls -A "$SRC")"
          fi
          echo "== Fresh file tree =="
          find "$SRC" -type f | sort
          echo "== Pre-flight checks on fresh files =="
          test -f "$SRC/index.html"
          test -f "$SRC/about.html"
          test -f "$SRC/portfolio.html"
          test -f "$SRC/acquire.html"
          test -f "$SRC/contact.html"
          test -f "$SRC/SOURCES.md"
          test -f "$SRC/video/hero-city-night.mp4"
          test "$(ls "$SRC/images" | wc -l)" -eq 21
          CANVAS_COUNT=$(grep -c '<canvas' "$SRC/index.html" || true)
          echo "canvas tags in fresh index.html: $CANVAS_COUNT"
          test "$CANVAS_COUNT" -eq 0
          grep -q 'hero-video' "$SRC/index.html"
          echo "hero-video marker: present"
          echo "== Wiping repo working tree =="
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          echo "== Installing fresh files =="
          cp -r "$SRC/." .
          printf '%s' 'primedomaincapital.com' > CNAME
          echo "== CNAME bytes =="
          od -c CNAME
          echo "== Final tree =="
          find . -path ./.git -prune -o -type f -print | sort
          git config user.name "primedomaincapital"
          git config user.email "primedomaincapital@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Clean rebuild: fresh upload of elevated site"
          git push
